<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger</title>
<meta name="theme-color" content="#028760">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 画面の中身は js/app.js がページごとに #view に描きます。
     ページの住所（URLの # 以降）
       #            メイン画面（いまは何も表示しない）
       ☰ メニュー   左上のボタンで開く。作成・一覧・在庫・備品・屋号情報・ログアウト
       #new         プロジェクト作成
       #list        プロジェクト一覧
       #stock       在庫
       #gear        備品
       #shop        屋号情報
       #p/ID        プロジェクトのメニュー
       #p/ID/detail イベント（店舗）詳細
       #p/ID/pack   在庫・備品（持ち物リスト）
       #p/ID/money  経費・トランザクション・集計
       #p/ID/pay    精算 -->
<header class="top">
  <div class="wrap">
    <!-- スマホ：☰ と Ledger（押すとメニュー／トップ） -->
    <div class="brand" id="brand" hidden><button id="menuBtn" class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button><a class="logo" href="#/">Ledger</a></div>
    <div class="ttl">
      <a id="back" class="back" href="#" hidden>‹ 戻る</a>
      <h1 id="title">Ledger</h1>
      <nav class="ptabs" id="ptabs" aria-label="プロジェクトのページ" hidden></nav>
    </div>
  </div>
</header>
<main><div class="wrap">
  <div id="status" class="status" role="status"></div>
  <div id="view"></div>
  <div id="pres" class="pres" aria-hidden="true"></div>
</div></main>

<!-- 左上の ☰ で開くメニュー -->
<div id="scrim" class="scrim"></div>
<nav id="drawer" class="drawer" aria-label="メニュー" aria-hidden="true" inert>
  <div class="dhead"><a class="logo" href="#/">Ledger</a><button id="menuClose" class="x" type="button" aria-label="メニューを閉じる">×</button></div>
  <a class="di primary" href="#new"><b>＋ プロジェクト作成</b></a>
  <a class="di" href="#list"><b>プロジェクト一覧</b><span id="cP"></span></a>
  <a class="di" href="#stock"><b>在庫</b><span id="cS"></span></a>
  <a class="di" href="#gear"><b>備品</b><span id="cG"></span></a>
  <a class="di" href="#shop"><b>屋号情報</b><span id="cShop"></span></a>
  <div class="dfoot" id="account" hidden><span id="who"></span><button type="button" class="ghost" id="logout">ログアウト</button></div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
